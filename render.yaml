# Render Blueprint — InvestIQ Backend API
# See https://docs.render.com/blueprint-spec
# Add all secret env vars in the Render Dashboard (Environment); they are not stored in this file.

services:
  - type: web
    runtime: node
    name: investiq-api
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Set these in Render Dashboard (Environment) — do not commit secrets:
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
